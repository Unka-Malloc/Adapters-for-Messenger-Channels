[workspace]
resolver = "3"
members = [
    "crates/a4mc",
    "crates/a4mc-discord",
    "crates/a4mc-slack",
    "crates/a4mc-telegram",
    "crates/a4mc-webhook",
    "fixtures/downstream-host",
]

[workspace.package]
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
repository = "https://github.com/Unka-Malloc/Adapters-for-Messenger-Channels"

[workspace.dependencies]
a4mc = { path = "crates/a4mc", version = "0.2.0" }
anyhow = "1"
base64 = "0.22"
fs2 = "0.4"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-native-roots", "url"] }
ureq = { version = "2.10", features = ["json"] }
zeroize = "1"
